    // AI Categorizer and Urgency Analyzer
    function analyzeComplaintText(title, description) {
      const text = `${title} ${description}`.toLowerCase();

      if (text.includes("ragging") || text.includes("bully") || text.includes("senior") || text.includes("intimida") || text.includes("money") || text.includes("threat") || text.includes("beat")) {
        return {
          category: "Bullying",
          priority: "High",
          authority: "Anti-Ragging Committee",
          confidence: 96,
          reason: "Detected patterns of peer intimidation and senior dominance violating UGC anti-ragging mandates."
        };
      }
      if (text.includes("harass") || text.includes("sexual") || text.includes("stalk") || text.includes("messages") || text.includes("photo") || text.includes("touch") || text.includes("whatsapp")) {
        return {
          category: "Harassment",
          priority: "Critical",
          authority: "Internal Complaints Committee (POSH/Women)",
          confidence: 98,
          reason: "Critical safety keywords identified under POSH Act guidelines. Immediate confidential review recommended."
        };
      }
      if (text.includes("discrim") || text.includes("caste") || text.includes("language") || text.includes("religion") || text.includes("tamil") || text.includes("hindi") || text.includes("region") || text.includes("bias")) {
        return {
          category: "Discrimination",
          priority: "High",
          authority: "Disciplinary & Equity Council",
          confidence: 92,
          reason: "Identified indicators of exclusionary treatment or language/background bias."
        };
      }
      if (text.includes("mark") || text.includes("internal") || text.includes("exam") || text.includes("cat") || text.includes("attendance") || text.includes("faculty") || text.includes("grade") || text.includes("detention")) {
        return {
          category: "Academic Issues",
          priority: "Medium",
          authority: "Academic Grievance Cell",
          confidence: 94,
          reason: "Examination marks discrepancies and attendance audit keywords matched."
        };
      }
      if (text.includes("hostel") || text.includes("mess") || text.includes("food") || text.includes("water") || text.includes("warden") || text.includes("room") || text.includes("stomach") || text.includes("cleaning")) {
        return {
          category: "Hostel Issues",
          priority: "High",
          authority: "Hostel Administration & Welfare",
          confidence: 95,
          reason: "Hostel living conditions, drinking water safety, or mess hygiene issues detected."
        };
      }
      if (text.includes("projector") || text.includes("fan") || text.includes("ac") || text.includes("toilet") || text.includes("lab") || text.includes("bus") || text.includes("wifi") || text.includes("light") || text.includes("bench")) {
        return {
          category: "Campus Facilities",
          priority: "Medium",
          authority: "Campus Facilities & Infrastructure",
          confidence: 90,
          reason: "Classroom audio-visuals, physical infrastructure, or transport amenity concerns."
        };
      }
      return {
        category: "Other Issues",
        priority: "Medium",
        authority: "Deanery of Student Affairs",
        confidence: 70,
        reason: "General campus grievance requiring standard administrative verification."
      };
    }

    // Audio chime using Web Audio API
    function playPortalSound(type = 'success') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15); // E5
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'alert') {
          osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
          osc.frequency.setValueAtTime(440, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch (e) {}
    }

        } else if (sidebarTab === 'escalated') {
          list = list.filter(c => c.isEscalated);
        }

            c.title.toLowerCase().includes(q) ||

        if (!title && !description) {
          alert('Please enter a brief title or description first to allow AI classification.');
          return;
        }
        const res = analyzeComplaintText(title, description);
        setAiResult(res);
      };

        e.preventDefault();
        onSubmit({
          studentId: currentUser?.userId || 'STU2026-01',
          studentName: currentUser?.fullName || 'Dharsan',
          studentEmail: currentUser?.email || 'studentskit@gmail.com',
          studentRegisterNo: currentUser?.registerNo || '711522CS101',
          category,
          title,
          description,
          incidentDate,
          incidentLocation,
          priority,
          isAnonymous,
          evidenceName,
          evidenceUrl: evidenceName ? 'https://images.unsplash.com/photo-1548839140-29a749e1bc4e?auto=format&fit=crop&q=80&w=600' : ''

                      value={regDept}
                      onChange={e => setRegDept(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 text-white text-xs"
                    >
                      <option value="Computer Science & Engineering">CSE</option>
                      <option value="Artificial Intelligence & Data Science">AI & DS</option>
                      <option value="Information Technology">IT</option>
                      <option value="Mechanical Engineering">Mechanical</option>
                      <option value="Electronics & Communication Engg">ECE</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Year of Study</label>
                    <select
                      value={regYear}
                      onChange={e => setRegYear(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 text-white text-xs"
                    >
                      <option value="1st Year">1st Year</option>
                      <option value="2nd Year">2nd Year</option>
                      <option value="3rd Year">3rd Year</option>
                      <option value="4th Year">4th Year</option>
                    </select>
                  </div>
                </div>

                <div className="p-2.5 rounded-xl bg-navy-950 border border-slate-800">
                  <label className="flex items-center space-x-2 cursor-pointer text-xs">
                    <input
                      type="checkbox"
                      checked={regHostel}
                      onChange={e => setRegHostel(e.target.checked)}
                      className="rounded text-sky-500 bg-slate-800"
                    />
                    <span className="font-bold text-slate-200">Hostel Resident</span>
                  </label>
                  {regHostel && (
                    <input
                      type="text"
                      value={regHostelName}
                      onChange={e => setRegHostelName(e.target.value)}
                      placeholder="Hostel Name & Room Number"
                      className="w-full mt-2 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-xs"
                    />
                  )}
                </div>

                <button
                  type="submit"
                  className="w-full py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-white text-xs font-bold shadow-lg shadow-sky-500/25 mt-2"
                >
                  Create Student Account & Enter Portal →
                </button>
              </form>
            )}

          </div>
        </div>
      );
    }

    // Render the React application into the root element
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JusticeCampusApp />);
  </script>
</body>
</html>
